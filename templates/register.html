{% extends 'base.html' %}{% block content %}<section class="card"><h1>Student registration</h1><p class="muted">Your account must be approved by the placement cell before you can sign in.</p><form method="post"><div class="grid">
<div><label>Registration number</label><input name="reg_no" required></div><div><label>Email ID</label><input type="email" name="email" required></div>
<div><label>First name</label><input name="first_name" required></div><div><label>Last name</label><input name="last_name" required></div>
<div><label>Date of birth</label><input type="date" name="dob"></div><div><label>Contact number</label><input name="phone"></div>
<div><label>Location</label><input name="location"></div><div><label>Education / qualification</label><input name="education" placeholder="B.Tech, M.Sc, etc."></div>
<div><label>Experience (years)</label><input type="number" name="experience" min="0" value="0"></div><div><label>Technical and soft skills</label><input name="skills" placeholder="python,sql,communication"></div>
<div><label>Hobbies</label><input name="hobbies"></div><div><label>Interests</label><input name="interests"></div>
<div><label>Job positions looking for</label><input name="positions"></div><div><label>Preferred job location</label><input name="job_location"></div>
<div><label>Password</label><input type="password" name="password" required minlength="6"></div><div><label>Confirm password</label><input type="password" name="confirm_password" required></div>
</div><p><button>Create account</button></p></form></section>{% endblock %}
